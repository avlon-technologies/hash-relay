<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>HashRelay notification destinations</title>
<desc>RoutingService publishes NotificationAccepted; DeliveryService subscribes to it and reads EndpointStore, which EndpointService writes. Desktop and mobile destination bands describe proposed connections without relationship arrows. Dotted frame and proposal card borders distinguish speculative groupings and application options.</desc>
<defs>
<marker id="arrow" orient="auto" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#167BC1"/></marker>
</defs>
<rect x="0" y="0" width="1536" height="1024" fill="#FFFFFF"/>
<text x="44" y="111" font-size="46" font-weight="750" fill="#091629">HashRelay notification destinations</text>
<text x="45" y="159" font-size="27" fill="#4C586A">Routing and registration, with proposed desktop and mobile connections</text>

<g class="domain" data-label="Routing and endpoint registration" data-grade="speculative">
<rect x="29" y="201" width="661" height="732" rx="16" fill="#EFF8FF" stroke="#83BDE5" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="52" y="243" font-size="27" font-weight="700" fill="#102449">Routing and endpoint registration</text>
<text x="52" y="267" font-size="14" fill="#586A7E">Service responsibilities supporting notification distribution</text>
<g class="service" data-label="RoutingService" data-grade="declared">
<rect x="55" y="294" width="231" height="159" rx="12" fill="#E1F1FE" stroke="#50A3EC" stroke-width="1.5"/>
<circle cx="170" cy="323" r="12" fill="none" stroke="#167BC1" stroke-width="6"/>
<text x="170" y="361" text-anchor="middle" font-size="20" font-weight="700" fill="#102449">RoutingService</text>
<text x="170" y="389" text-anchor="middle" font-size="17" fill="#465970"><tspan x="170">Authorizes publications</tspan><tspan x="170" dy="22">and subscriptions;</tspan><tspan x="170" dy="22">matches hashtags</tspan></text>
</g>
<g class="service" data-label="NotificationAccepted" data-grade="declared">
<rect x="415" y="294" width="244" height="159" rx="12" fill="#F0EBFC" stroke="#A18AE9" stroke-width="1.5"/>
<rect x="521" y="310" width="32" height="34" rx="5" fill="#7551BD"/>
<path d="M 528 320 L 546 320 M 528 328 L 546 328 M 528 336 L 541 336" fill="none" stroke="#FFFFFF" stroke-width="3"/>
<text x="537" y="371" text-anchor="middle" font-size="20" font-weight="700" fill="#102449">NotificationAccepted</text>
<text x="537" y="401" text-anchor="middle" font-size="17" fill="#465970"><tspan x="537">Accepted-notification</tspan><tspan x="537" dy="22">event</tspan></text>
</g>
<g class="service" data-label="DeliveryService" data-grade="declared">
<rect x="420" y="526" width="233" height="163" rx="12" fill="#E0F6ED" stroke="#26B78A" stroke-width="2"/>
<path d="M 536 550 L 536 565 L 520 565 L 520 577 M 536 565 L 552 565 L 552 577" fill="none" stroke="#159B79" stroke-width="4"/>
<circle cx="536" cy="548" r="6" fill="#FFFFFF" stroke="#159B79" stroke-width="4"/>
<circle cx="520" cy="581" r="6" fill="#FFFFFF" stroke="#159B79" stroke-width="4"/>
<circle cx="552" cy="581" r="6" fill="#FFFFFF" stroke="#159B79" stroke-width="4"/>
<text x="536" y="620" text-anchor="middle" font-size="22" font-weight="750" fill="#102449">DeliveryService</text>
<text x="536" y="649" text-anchor="middle" font-size="17" fill="#465970"><tspan x="536">Fans out to eligible</tspan><tspan x="536" dy="22">endpoint transports</tspan></text>
</g>
<g class="service" data-label="EndpointService" data-grade="declared">
<rect x="55" y="760" width="239" height="143" rx="12" fill="#FFF8E9" stroke="#E7B449" stroke-width="1.5"/>
<text x="174" y="803" text-anchor="middle" font-size="21" font-weight="700" fill="#102449">EndpointService</text>
<text x="174" y="836" text-anchor="middle" font-size="17" fill="#465970"><tspan x="174">Registers desktop agents</tspan><tspan x="174" dy="23">and mobile push tokens</tspan></text>
</g>
<g class="service" data-label="EndpointStore" data-grade="declared">
<rect x="419" y="760" width="240" height="143" rx="12" fill="#FDEBF1" stroke="#D77095" stroke-width="1.5"/>
<text x="539" y="803" text-anchor="middle" font-size="21" font-weight="700" fill="#102449">EndpointStore</text>
<text x="539" y="836" text-anchor="middle" font-size="17" fill="#465970"><tspan x="539">Endpoint registration</tspan><tspan x="539" dy="23">storage</tspan></text>
</g>
</g>

<g class="domain" data-label="Desktop" data-grade="speculative">
<rect x="708" y="201" width="645" height="270" rx="16" fill="#EAF7F0" stroke="#73BF97" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="733" y="240" font-size="28" font-weight="700" fill="#124F39">Desktop</text>
<text x="733" y="263" font-size="14" fill="#526D61">Native Windows, macOS, and Linux notifications</text>
<path d="M 763 313 L 763 299 Q 763 279 785 279 L 1270 279 Q 1290 279 1290 299 L 1290 313" fill="none" stroke="#64BA8E" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1030" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#156242">PROPOSED — SignalR real-time desktop delivery</text>
<g class="service" data-label="DesktopAgent" data-grade="declared">
<rect x="746" y="321" width="248" height="129" rx="12" fill="#E5F3FE" stroke="#63A9DF" stroke-width="1.5"/>
<text x="870" y="353" text-anchor="middle" font-size="21" font-weight="700" fill="#102449">DesktopAgent</text>
<text x="870" y="381" text-anchor="middle" font-size="16" fill="#465970"><tspan x="870">Installable user-session</tspan><tspan x="870" dy="21">client displaying native</tspan><tspan x="870" dy="21">notifications</tspan></text>
</g>
<g class="service" data-label="Native notification centers" data-grade="declared">
<rect x="1077" y="321" width="256" height="129" rx="12" fill="#E5F3FE" stroke="#63A9DF" stroke-width="1.5"/>
<text x="1205" y="365" text-anchor="middle" font-size="18" font-weight="700" fill="#102449">Native notification centers</text>
<text x="1205" y="400" text-anchor="middle" font-size="17" fill="#465970">Windows · macOS · Linux</text>
</g>
</g>

<g class="domain" data-label="Mobile" data-grade="speculative">
<rect x="708" y="490" width="645" height="402" rx="16" fill="#F1EDFC" stroke="#AD97DC" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="733" y="530" font-size="28" font-weight="700" fill="#4A2990">Mobile</text>
<text x="733" y="553" font-size="14" fill="#6A5D82">iOS and Android push destinations</text>
<path d="M 776 603 L 776 592 Q 776 576 796 576 L 1246 576 Q 1266 576 1266 596 L 1266 615" fill="none" stroke="#709EE8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1024" y="595" text-anchor="middle" font-size="15" font-weight="700" fill="#2579D8">PROPOSED — iOS push via APNs</text>
<path d="M 776 762 L 776 751 Q 776 731 797 731 L 1130 731" fill="none" stroke="#A283DD" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1004" y="751" text-anchor="middle" font-size="15" font-weight="700" fill="#7548BE">PROPOSED — Android push via FCM</text>
<g class="service" data-label="ApplePush / APNs" data-grade="declared">
<rect x="736" y="611" width="286" height="99" rx="12" fill="#E5F3FE" stroke="#63A9DF" stroke-width="1.5"/>
<text x="879" y="649" text-anchor="middle" font-size="21" font-weight="700" fill="#102449">ApplePush / APNs</text>
<text x="879" y="680" text-anchor="middle" font-size="17" fill="#465970">iOS app push delivery</text>
</g>
<g class="service" data-label="FirebaseMessaging / FCM" data-grade="declared">
<rect x="736" y="770" width="316" height="99" rx="12" fill="#E7F6EA" stroke="#77BF87" stroke-width="1.5"/>
<text x="894" y="808" text-anchor="middle" font-size="20" font-weight="700" fill="#102449">FirebaseMessaging / FCM</text>
<text x="894" y="840" text-anchor="middle" font-size="17" fill="#465970">Android push delivery</text>
</g>
<g class="service" data-label="PROPOSED mobile app options" data-grade="speculative">
<rect x="1129" y="623" width="208" height="201" rx="12" fill="#FDECF3" stroke="#D58AA9" stroke-width="1.5" stroke-dasharray="2 4"/>
<rect x="1219" y="642" width="27" height="39" rx="4" fill="none" stroke="#AF3D69" stroke-width="4"/>
<text x="1233" y="714" text-anchor="middle" font-size="19" font-weight="700" fill="#102449"><tspan x="1233">PROPOSED mobile</tspan><tspan x="1233" dy="24">app options</tspan></text>
<text x="1233" y="768" text-anchor="middle" font-size="16" fill="#465970"><tspan x="1233">Developer-integrated</tspan><tspan x="1233" dy="22">apps · first-party</tspan><tspan x="1233" dy="22">companion</tspan></text>
</g>
</g>

<g class="actor" data-label="Subscriber" data-grade="declared">
<rect x="1371" y="490" width="149" height="390" rx="13" fill="#F3F5F7" stroke="#BAC4D0" stroke-width="1.5"/>
<circle cx="1445" cy="579" r="16" fill="#46515F"/>
<path d="M 1418 623 C 1418 588 1472 588 1472 623 Q 1472 627 1467 627 L 1423 627 Q 1418 627 1418 623" fill="#46515F"/>
<text x="1445" y="665" text-anchor="middle" font-size="20" font-weight="700" fill="#102449">Subscriber</text>
<text x="1445" y="698" text-anchor="middle" font-size="16" fill="#465970"><tspan x="1445">Receives</tspan><tspan x="1445" dy="22">notifications</tspan><tspan x="1445" dy="22">through registered</tspan><tspan x="1445" dy="22">endpoints</tspan></text>
</g>

<g class="edge" data-from="RoutingService" data-to="NotificationAccepted">
<path d="M 286 372 L 415 372" fill="none" stroke="#167BC1" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="350" y="359" text-anchor="middle" font-size="17" fill="#102449" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">publishes</text>
</g>
<g class="edge" data-from="DeliveryService" data-to="NotificationAccepted">
<path d="M 537 526 L 537 453" fill="none" stroke="#167BC1" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="550" y="492" font-size="17" fill="#102449" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">subscribes to</text>
</g>
<g class="edge" data-from="EndpointService" data-to="EndpointStore">
<path d="M 294 830 L 419 830" fill="none" stroke="#167BC1" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="356" y="817" text-anchor="middle" font-size="17" fill="#102449" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">writes</text>
</g>
<g class="edge" data-from="DeliveryService" data-to="EndpointStore">
<path d="M 537 689 L 537 760" fill="none" stroke="#167BC1" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="553" y="730" font-size="17" fill="#102449" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">reads</text>
</g>
</svg>