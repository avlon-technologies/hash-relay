<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>Actionable approvals: the round trip</title>
<desc>HashRelay resolves approvals using durable, strongly consistent persistence. Eight solid arrows show declared architecture relationships. Publisher and Subscriber integration is described as a narrative proposal, without adding undeclared connectors. Existing and proposed pathway names express a design assumption, not verified deployment status.</desc>
<defs>
<marker id="arrow" orient="auto" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="12" refY="6.5"><path d="M 0 0 L 12 6.5 L 0 13 Z" fill="#24364A"/></marker>
</defs>
<rect x="0" y="0" width="1536" height="1024" fill="#FFFFFF"/>
<text x="38" y="46" font-size="39" font-weight="750" fill="#0B2045">Actionable approvals: the round trip</text>
<text x="38" y="82" font-size="24" fill="#647B9B">HashRelay resolves the decision; the originating publisher executes</text>

<g class="domain" data-label="Existing notification pathway" data-grade="declared">
<rect x="347" y="116" width="830" height="216" rx="15" fill="#EDF6FF" stroke="#579FE7" stroke-width="1.6"/>
<text x="365" y="146" font-size="21" font-weight="700" fill="#0755CA">Existing notification pathway</text>
<text x="1152" y="145" text-anchor="end" font-size="14" fill="#466381">Reuse routing and delivery</text>
<g class="service" data-label="RoutingService" data-grade="declared">
<rect x="380" y="169" width="210" height="141" rx="8" fill="#F7FBFF" stroke="#668EB9" stroke-width="1.6"/>
<path d="M 485 188 L 485 206 M 467 219 L 467 207 L 502 207 L 502 219" fill="none" stroke="#174580" stroke-width="3"/>
<circle cx="485" cy="188" r="6" fill="#FFFFFF" stroke="#174580" stroke-width="3"/>
<circle cx="467" cy="220" r="6" fill="#FFFFFF" stroke="#174580" stroke-width="3"/>
<circle cx="502" cy="220" r="6" fill="#FFFFFF" stroke="#174580" stroke-width="3"/>
<text x="485" y="252" text-anchor="middle" font-size="19" font-weight="700" fill="#102D58">RoutingService</text>
<text x="485" y="276" text-anchor="middle" font-size="15" fill="#263C55"><tspan x="485">Authorizes publications</tspan><tspan x="485" dy="19">and matches hashtags</tspan></text>
</g>
<g class="service" data-label="NotificationAccepted" data-grade="declared">
<rect x="689" y="171" width="163" height="139" rx="8" fill="#F7FBFF" stroke="#668EB9" stroke-width="1.6"/>
<path d="M 757 190 L 778 190 L 787 200 L 787 231 L 757 231 Z M 778 190 L 778 201 L 787 201 M 763 208 L 780 208 M 763 215 L 780 215 M 763 222 L 778 222" fill="none" stroke="#3269B2" stroke-width="2.5"/>
<text x="770" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#102D58">NotificationAccepted</text>
<text x="770" y="279" text-anchor="middle" font-size="13" fill="#263C55"><tspan x="770">Accepted notification</tspan><tspan x="770" dy="17">event</tspan></text>
</g>
<g class="service" data-label="DeliveryService" data-grade="declared">
<rect x="968" y="169" width="183" height="141" rx="8" fill="#F7FBFF" stroke="#668EB9" stroke-width="1.6"/>
<path d="M 1038 207 L 1082 187 L 1068 231 L 1058 215 Z M 1058 215 L 1082 187" fill="#3285D8" stroke="#FFFFFF" stroke-width="2"/>
<text x="1060" y="253" text-anchor="middle" font-size="18" font-weight="700" fill="#102D58">DeliveryService</text>
<text x="1060" y="274" text-anchor="middle" font-size="13" fill="#263C55"><tspan x="1060">Fans out notifications to</tspan><tspan x="1060" dy="16">eligible endpoint transports</tspan></text>
</g>
</g>

<g class="domain" data-label="Proposed actionable-approval extension" data-grade="declared">
<rect x="305" y="392" width="925" height="538" rx="15" fill="#F0FAF1" stroke="#57AB6A" stroke-width="1.6"/>
<text x="333" y="425" font-size="21" font-weight="700" fill="#087333">Proposed actionable-approval extension</text>
<text x="1204" y="425" text-anchor="end" font-size="13" fill="#466A51">Resolve once; expose durable completion</text>
<g class="service" data-label="ApprovalService" data-grade="declared">
<rect x="366" y="445" width="344" height="225" rx="9" fill="#E0F3DF" stroke="#218348" stroke-width="2"/>
<circle cx="538" cy="479" r="18" fill="#08713D"/>
<circle cx="538" cy="479" r="8" fill="#E0F3DF"/>
<text x="538" y="523" text-anchor="middle" font-size="23" font-weight="700" fill="#12362A">ApprovalService</text>
<text x="538" y="550" text-anchor="middle" font-size="16" fill="#233C35"><tspan x="538">Creates and atomically resolves</tspan><tspan x="538" dy="21">authorized approvals</tspan></text>
<text x="538" y="602" text-anchor="middle" font-size="15" fill="#233C35"><tspan x="538">Handles RequestApproval and DecideApproval</tspan></text>
<text x="538" y="636" text-anchor="middle" font-size="15" font-weight="600" fill="#155733"><tspan x="538">Does not execute approved operations</tspan></text>
</g>
<g class="service" data-label="ApprovalStore" data-grade="declared">
<rect x="336" y="735" width="236" height="139" rx="8" fill="#EFEBFA" stroke="#9785C8" stroke-width="1.6"/>
<path d="M 436 758 C 436 748 472 748 472 758 L 472 783 C 472 794 436 794 436 783 Z" fill="#514292"/>
<ellipse cx="454" cy="758" rx="18" ry="6" fill="#514292" stroke="#FFFFFF" stroke-width="1.5"/>
<path d="M 436 770 C 442 779 466 779 472 770 M 436 781 C 442 790 466 790 472 781" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="454" y="818" text-anchor="middle" font-size="21" font-weight="700" fill="#102D58">ApprovalStore</text>
<text x="454" y="841" text-anchor="middle" font-size="15" fill="#263C55"><tspan x="454">Durable persistence with</tspan><tspan x="454" dy="19">strong consistency</tspan></text>
</g>
<g class="service" data-label="ApprovalResolved" data-grade="declared">
<rect x="619" y="735" width="217" height="116" rx="8" fill="#F6FCF5" stroke="#39945A" stroke-width="1.6"/>
<path d="M 713 754 L 734 754 L 744 764 L 744 795 L 713 795 Z M 734 754 L 734 765 L 744 765 M 720 772 L 738 772 M 720 780 L 738 780 M 720 788 L 734 788" fill="none" stroke="#167347" stroke-width="2.5"/>
<text x="727" y="820" text-anchor="middle" font-size="19" font-weight="700" fill="#163B2C">ApprovalResolved</text>
<text x="727" y="840" text-anchor="middle" font-size="14" fill="#263C55">Committed decision event</text>
</g>
<g class="service" data-label="ApprovalOutcomeReader" data-grade="declared">
<rect x="969" y="735" width="231" height="139" rx="8" fill="#E5F7F7" stroke="#45A2A9" stroke-width="1.6"/>
<circle cx="1080" cy="764" r="14" fill="none" stroke="#12627B" stroke-width="3.5"/>
<path d="M 1090 775 L 1105 789" stroke="#12627B" stroke-width="5" stroke-linecap="round"/>
<text x="1084" y="815" text-anchor="middle" font-size="18" font-weight="700" fill="#102D58">ApprovalOutcomeReader</text>
<text x="1084" y="837" text-anchor="middle" font-size="14" fill="#263C55"><tspan x="1084">Makes durable completion</tspan><tspan x="1084" dy="17">available for authenticated</tspan><tspan x="1084" dy="17">retrieval</tspan></text>
</g>
</g>

<g class="actor" data-label="Publisher" data-grade="declared">
<rect x="22" y="155" width="220" height="301" rx="12" fill="#E7F3FF" stroke="#65ABE8" stroke-width="1.6"/>
<rect x="94" y="185" width="76" height="66" rx="5" fill="#FFFFFF" stroke="#174580" stroke-width="4"/>
<path d="M 95 202 L 169 202 M 119 218 L 110 227 L 119 236 M 145 218 L 154 227 L 145 236 M 138 214 L 128 241" fill="none" stroke="#174580" stroke-width="3"/>
<text x="132" y="286" text-anchor="middle" font-size="23" font-weight="700" fill="#102D58">Publisher</text>
<text x="132" y="315" text-anchor="middle" font-size="15" fill="#263C55"><tspan x="132">Originating application;</tspan><tspan x="132" dy="20">executes its own operation</tspan></text>
<text x="132" y="378" text-anchor="middle" font-size="14" fill="#514292"><tspan x="132">Narrative proposal:</tspan><tspan x="132" dy="18">request approval, retrieve</tspan><tspan x="132" dy="18">result, then execute locally</tspan></text>
</g>

<g class="actor" data-label="Subscriber" data-grade="declared">
<rect x="1285" y="148" width="229" height="210" rx="12" fill="#E7F3FF" stroke="#65ABE8" stroke-width="1.6"/>
<circle cx="1400" cy="190" r="17" fill="#E1EEFF" stroke="#174580" stroke-width="3"/>
<path d="M 1368 245 L 1371 225 Q 1376 210 1400 210 Q 1424 210 1429 225 L 1432 245 Z" fill="#398DDA" stroke="#174580" stroke-width="2"/>
<text x="1400" y="275" text-anchor="middle" font-size="22" font-weight="700" fill="#102D58">Subscriber</text>
<text x="1400" y="299" text-anchor="middle" font-size="15" fill="#263C55"><tspan x="1400">Human approver in the</tspan><tspan x="1400" dy="19">proposed interaction</tspan></text>
</g>
<text x="1400" y="382" text-anchor="middle" font-size="13" fill="#80502C"><tspan x="1400">Narrative proposal: sees notification</tspan><tspan x="1400" dy="18">and submits DecideApproval</tspan></text>

<g class="service" data-label="TenantAdministrationService" data-grade="declared">
<rect x="1250" y="473" width="264" height="178" rx="9" fill="#EDF6FF" stroke="#668EB9" stroke-width="1.6"/>
<text x="1382" y="510" text-anchor="middle" font-size="16" font-weight="700" fill="#102D58">TenantAdministrationService</text>
<text x="1382" y="541" text-anchor="middle" font-size="15" fill="#263C55"><tspan x="1382">Records tenant owners</tspan><tspan x="1382" dy="20">and members</tspan></text>
<text x="1382" y="600" text-anchor="middle" font-size="14" fill="#586D85"><tspan x="1382">Authentication integration</tspan><tspan x="1382" dy="19">still to be specified</tspan></text>
</g>

<g fill="none" stroke="#24364A" stroke-width="2" stroke-linejoin="round">
<g class="edge" data-from="ApprovalService" data-to="RoutingService">
<path d="M 479 445 L 479 310" marker-end="url(#arrow)"/>
<text x="491" y="365" fill="#172A40" stroke="#FFFFFF" stroke-width="2" paint-order="stroke" font-size="16">depends on</text>
</g>
<g class="edge" data-from="RoutingService" data-to="NotificationAccepted">
<path d="M 590 234 L 689 234" marker-end="url(#arrow)"/>
<text x="600" y="220" fill="#172A40" stroke="#FFFFFF" stroke-width="2" paint-order="stroke" font-size="15">publishes</text>
</g>
<g class="edge" data-from="DeliveryService" data-to="NotificationAccepted">
<path d="M 968 234 L 852 234" marker-end="url(#arrow)"/>
<text x="862" y="220" fill="#172A40" stroke="#FFFFFF" stroke-width="2" paint-order="stroke" font-size="15">subscribes to</text>
</g>
<g class="edge" data-from="ApprovalService" data-to="TenantAdministrationService">
<path d="M 710 535 L 1250 535" marker-end="url(#arrow)"/>
<text x="896" y="521" fill="#172A40" stroke="#FFFFFF" stroke-width="2" paint-order="stroke" font-size="16">depends on</text>
</g>
<g class="edge" data-from="ApprovalService" data-to="ApprovalStore">
<path d="M 417 670 L 417 735" marker-end="url(#arrow)"/>
<text x="431" y="705" fill="#172A40" stroke="#FFFFFF" stroke-width="2" paint-order="stroke" font-size="16">reads + writes</text>
</g>
<g class="edge" data-from="ApprovalService" data-to="ApprovalResolved">
<path d="M 675 670 L 675 735" marker-end="url(#arrow)"/>
<text x="689" y="705" fill="#172A40" stroke="#FFFFFF" stroke-width="2" paint-order="stroke" font-size="16">publishes</text>
</g>
<g class="edge" data-from="ApprovalOutcomeReader" data-to="ApprovalResolved">
<path d="M 969 794 L 836 794" marker-end="url(#arrow)"/>
<text x="851" y="779" fill="#172A40" stroke="#FFFFFF" stroke-width="2" paint-order="stroke" font-size="15">subscribes to</text>
</g>
<g class="edge" data-from="ApprovalOutcomeReader" data-to="ApprovalStore">
<path d="M 1080 874 L 1080 892 Q 1080 900 1072 900 L 462 900 Q 454 900 454 892 L 454 874" marker-end="url(#arrow)"/>
<text x="744" y="889" fill="#172A40" stroke="#FFFFFF" stroke-width="2" paint-order="stroke" font-size="16">reads</text>
</g>
</g>
<text x="770" y="975" text-anchor="middle" font-size="14" fill="#647B83">Existing/proposed status is a design assumption</text>
</svg>