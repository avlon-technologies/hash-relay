<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>HashRelay — Publish to hashtags. Reach every subscribed device.</title>
<desc>Product vision showing an authorized publisher, HashRelay cloud routing and delivery, and subscriber devices. Solid arrows show publication and subscription to NotificationAccepted. Dashed proposed routes show publishing interfaces and destination transports.</desc>
<defs>
<marker id="blue" orient="auto" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#0877DE"/></marker>
<marker id="green" orient="auto" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#009C86"/></marker>
<marker id="weak" orient="auto" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#499B96"/></marker>
</defs>
<rect x="0" y="0" width="1536" height="1024" fill="#FFFFFF"/>

<text x="740" y="172" text-anchor="middle" font-size="116" font-weight="800" letter-spacing="-5" fill="#09213E">HashRelay</text>
<text x="1060" y="162" font-size="25" font-weight="600" fill="#586F89">Product vision</text>
<text x="768" y="252" text-anchor="middle" font-size="44" font-weight="750" letter-spacing="-1.3" fill="#09213E">Publish to hashtags. Reach every subscribed device.</text>

<g class="actor" data-label="Authorized publisher" data-grade="declared">
<rect x="20" y="350" width="260" height="460" rx="24" fill="#F0F5FC" stroke="#E6EEF8" stroke-width="1.5"/>
<text x="150" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#09213E">Authorized publisher</text>
<circle cx="150" cy="476" r="21" fill="none" stroke="#537593" stroke-width="5"/>
<path d="M 111 543 C 111 497 189 497 189 543" fill="none" stroke="#537593" stroke-width="5" stroke-linecap="round"/>
<text x="150" y="601" text-anchor="middle" font-size="19" fill="#45627F" font-weight="600">
<tspan x="150" dy="0">Application / SDK / CLI /</tspan>
<tspan x="150" dy="30">AI MCP — PROPOSED</tspan>
<tspan x="150" dy="30">interfaces</tspan>
</text>
</g>

<g class="domain" data-label="HashRelay cloud" data-grade="declared">
<rect x="375" y="350" width="735" height="460" rx="72" fill="#EFF8FF" stroke="#DCEFFC" stroke-width="2"/>
<text x="742" y="430" text-anchor="middle" font-size="38" font-weight="750" fill="#09213E">HashRelay cloud</text>
<text x="742" y="469" text-anchor="middle" font-size="20" fill="#526D88">Workspace-scoped routing · Registered endpoint delivery</text>

<g class="service" data-label="RoutingService" data-grade="declared">
<rect x="400" y="535" width="200" height="175" rx="16" fill="#DCEFFF" stroke="#8BC7FF" stroke-width="1.8"/>
<text x="500" y="579" text-anchor="middle" font-size="32" font-weight="700" fill="#0877DE">#</text>
<text x="500" y="613" text-anchor="middle" font-size="22" font-weight="700" fill="#09213E">RoutingService</text>
<text x="500" y="649" text-anchor="middle" font-size="16" fill="#355D80"><tspan x="500">Authorize and match</tspan><tspan x="500" dy="24">workspace hashtags</tspan></text>
</g>

<g class="service" data-label="NotificationAccepted" data-grade="declared">
<rect x="675" y="588" width="195" height="50" rx="25" fill="#E8DDFF" stroke="#BA9BFF" stroke-width="1.5"/>
<text x="772.5" y="619" text-anchor="middle" font-size="16" font-weight="600" fill="#302765">NotificationAccepted</text>
</g>

<g class="service" data-label="DeliveryService" data-grade="declared">
<rect x="940" y="535" width="150" height="175" rx="16" fill="#DEF6EF" stroke="#65CFB9" stroke-width="1.8"/>
<path d="M 1000 569 L 1030 569 M 1015 554 L 1015 584 M 1004 558 L 1026 580 M 1004 580 L 1026 558" stroke="#009C86" stroke-width="6" stroke-linecap="round"/>
<text x="1015" y="613" text-anchor="middle" font-size="18" font-weight="700" fill="#09213E">DeliveryService</text>
<text x="1015" y="644" text-anchor="middle" font-size="16" fill="#355D80"><tspan x="1015">Fan out to eligible</tspan><tspan x="1015" dy="23">registered</tspan><tspan x="1015" dy="23">endpoints</tspan></text>
</g>
</g>

<g class="domain" data-label="Subscriber destinations" data-grade="declared">
<rect x="1240" y="350" width="276" height="460" rx="24" fill="#EFFAF5" stroke="#E2F5EB" stroke-width="1.5"/>
<text x="1378" y="397" text-anchor="middle" font-size="21" font-weight="700" fill="#09213E">Subscriber destinations</text>
<text x="1378" y="426" text-anchor="middle" font-size="18" fill="#526D88">Registered devices</text>

<g class="service" data-label="Desktop native notifications" data-grade="declared">
<rect x="1256" y="455" width="244" height="110" rx="17" fill="#FFFFFF" stroke="#D2F0E1" stroke-width="1.5"/>
<text x="1378" y="489" text-anchor="middle" font-size="20" font-weight="700" fill="#09213E"><tspan x="1378">Desktop native</tspan><tspan x="1378" dy="25">notifications</tspan></text>
<text x="1378" y="544" text-anchor="middle" font-size="16" fill="#526D88">Windows · macOS · Linux</text>
</g>

<g class="service" data-label="iOS mobile push" data-grade="declared">
<rect x="1256" y="592" width="244" height="80" rx="17" fill="#FFFFFF" stroke="#D2F0E1" stroke-width="1.5"/>
<text x="1378" y="639" text-anchor="middle" font-size="21" font-weight="700" fill="#09213E">iOS mobile push</text>
</g>

<g class="service" data-label="Android mobile push" data-grade="declared">
<rect x="1256" y="700" width="244" height="80" rx="17" fill="#FFFFFF" stroke="#D2F0E1" stroke-width="1.5"/>
<text x="1378" y="747" text-anchor="middle" font-size="20" font-weight="700" fill="#09213E">Android mobile push</text>
</g>
</g>

<g class="edge" data-from="RoutingService" data-to="NotificationAccepted">
<path d="M 600 613 L 675 613" fill="none" stroke="#0877DE" stroke-width="3.5" marker-end="url(#blue)"/>
<text x="637" y="577" text-anchor="middle" font-size="14" font-weight="600" fill="#173F67" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">publishes</text>
</g>
<g class="edge" data-from="DeliveryService" data-to="NotificationAccepted">
<path d="M 940 613 L 870 613" fill="none" stroke="#009C86" stroke-width="3.5" marker-end="url(#green)"/>
<text x="904" y="577" text-anchor="middle" font-size="13" font-weight="600" fill="#245E5A" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">subscribes to</text>
</g>

<g class="edge" data-from="Authorized publisher" data-to="RoutingService" data-kind="derived" data-grade="inferred">
<path d="M 280 613 L 400 613" fill="none" stroke="#499B96" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#weak)"/>
<text x="338" y="548" text-anchor="middle" font-size="13" font-weight="600" fill="#287F7B" paint-order="stroke" stroke="#FFFFFF" stroke-width="6"><tspan x="338">PROPOSED</tspan><tspan x="338" dy="20">publishing interfaces</tspan></text>
</g>
<g class="edge" data-from="DeliveryService" data-to="Desktop native notifications" data-kind="derived" data-grade="inferred">
<path d="M 1090 566 C 1140 566 1162 510 1256 510" fill="none" stroke="#499B96" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#weak)"/>
<text x="1174" y="477" text-anchor="middle" font-size="14" font-weight="600" fill="#287F7B" paint-order="stroke" stroke="#FFFFFF" stroke-width="6"><tspan x="1174">PROPOSED SignalR</tspan></text>
</g>
<g class="edge" data-from="DeliveryService" data-to="iOS mobile push" data-kind="derived" data-grade="inferred">
<path d="M 1090 632 L 1256 632" fill="none" stroke="#499B96" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#weak)"/>
<text x="1174" y="609" text-anchor="middle" font-size="14" font-weight="600" fill="#287F7B" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">PROPOSED APNs</text>
</g>
<g class="edge" data-from="DeliveryService" data-to="Android mobile push" data-kind="derived" data-grade="inferred">
<path d="M 1090 682 C 1140 682 1150 740 1256 740" fill="none" stroke="#499B96" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#weak)"/>
<text x="1174" y="784" text-anchor="middle" font-size="14" font-weight="600" fill="#287F7B" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">PROPOSED FCM</text>
</g>
</svg>