name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "architecture/**", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Azure Artifact Signing (windows job)

jobs:
  test:
    name: Server tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/HashRelay.Server.Tests/HashRelay.Server.Tests.csproj -c Release

  mobile:
    name: Mobile app type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/HashRelay.Mobile/package-lock.json
      - run: npm ci
        working-directory: src/HashRelay.Mobile
      - run: npm run typecheck
        working-directory: src/HashRelay.Mobile
      - run: npx expo config --type public > /dev/null
        working-directory: src/HashRelay.Mobile

  windows:
    name: Agent, CLI and installer (Windows)
    runs-on: windows-latest
    needs: test
    env:
      # Sign on main (and manual runs) once infra/signing has been applied and the variable set; PR builds stay unsigned.
      SIGN: ${{ github.event_name != 'pull_request' && vars.AZURE_SIGNING_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Inno Setup
        run: winget install --id JRSoftware.InnoSetup --scope user --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
        shell: pwsh
      - name: Azure login for Artifact Signing
        if: env.SIGN == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build
        run: ./build.ps1 -SkipTests -Sign:($env:SIGN -eq 'true')
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: hashrelay-windows
          path: |
            artifacts/HashRelay-Setup.exe
            artifacts/hashrelay-cli-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hashrelay-server
          path: artifacts/server

  # Continuous deployment: every push to main that passes the tests and the Windows build is rolled out to dev.
  # Signs in over OIDC as the Terraform-managed identity id-github-hashrelay-dev (infra/terraform/github-deploy.tf);
  # the GitHub environment "dev" carries its variables (infra/setup-github-deploy.ps1). Infrastructure changes are
  # still applied by hand with deploy.ps1; this job only builds and rolls the image.
  deploy:
    name: Deploy to dev
    needs: [test, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ vars.PUBLIC_URL }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Check the environment is wired
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          CONTAINERAPP_NAME: ${{ vars.CONTAINERAPP_NAME }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          missing=""
          for v in AZURE_CLIENT_ID ACR_NAME CONTAINERAPP_NAME RESOURCE_GROUP PUBLIC_URL; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub environment 'dev' is missing:$missing. Apply infra/terraform (./deploy.ps1 -SkipImage), then run ./infra/setup-github-deploy.ps1."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Bring in the Windows installer and CLI for /downloads
        uses: actions/download-artifact@v4
        with:
          name: hashrelay-windows
          path: src/HashRelay.Server/wwwroot/downloads
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build the image in the registry
        id: image
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          tag="${version}-${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M%S)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "server=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"
          az acr build --registry "$ACR_NAME" --image "hashrelay-server:$tag" --image "hashrelay-server:latest" \
            --build-arg "BUILD_LABEL=$tag" --file Dockerfile .
      - name: Roll out
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINERAPP_NAME: ${{ vars.CONTAINERAPP_NAME }}
        run: |
          az containerapp update -g "$RESOURCE_GROUP" -n "$CONTAINERAPP_NAME" \
            --image "${{ steps.image.outputs.server }}/hashrelay-server:${{ steps.image.outputs.tag }}" -o none
      - name: Smoke test (the new build is serving)
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          # Loops absorb the scale-to-zero cold start and the old revision draining.
          for i in $(seq 1 30); do
            build=$(curl -fsS -m 20 "$PUBLIC_URL/healthz" | jq -r '.build // empty' || true)
            if [ "$build" = "$TAG" ]; then echo "serving $TAG"; exit 0; fi
            echo "attempt $i: serving '${build:-?}', waiting for $TAG"; sleep 10
          done
          echo "::error::$PUBLIC_URL/healthz never reported build $TAG"
          exit 1
